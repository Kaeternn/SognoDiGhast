version: ${projectVersion} # Never change this
debug: false # Turn this to true if you need debuging information only
only_happy_ghast: true # If true, regular ghasts won't get faster
only_when_ridden: false # If true, happy ghasts will get faster only when a player ride it and overwrite only_happy_ghast
speed_multiplier: 2.0 # Flying speed multiplier
dimensions: # If you want to disabling a min or max limit put it to "infinity"
  overworld:
    min: 150
    max: infinity
  nether:
    min: 150
    max: infinity
  end:
    min: 150
    max: infinity
worlds: {} # Overwrite dimension's value if setted, write it like dimensions entry but with world name
